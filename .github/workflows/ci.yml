name: RSpec Automation Suite

# When this workflow runs:
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you manually trigger a run from the GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repo's code onto the runner
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Install Ruby + gems (this action also caches gems automatically
      #    between runs when bundler-cache: true, so future runs are faster)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      # 3. ubuntu-latest already ships with Chrome + a matching chromedriver
      #    pre-installed, and Selenium Manager (bundled in selenium-webdriver
      #    4.6+) auto-detects it. We intentionally do NOT install a second
      #    Chrome here -- doing so causes version/PATH conflicts that crash
      #    Chrome on launch ("session not created" errors).
      - name: Print installed Chrome version (debug info)
        run: google-chrome --version || chromium-browser --version || true

      # 4. Run the test suite headlessly.
      #    HEADLESS=true is the default in our Capybara config anyway,
      #    but setting it explicitly here documents intent for CI.
      - name: Run RSpec suite
        env:
          HEADLESS: 'true'
        run: bundle exec rspec

      # 5. Even if tests fail, upload any failure screenshots so you can
      #    open them from the GitHub Actions run page and see exactly
      #    what the browser looked like when the test failed.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # 6. Upload the RSpec results file for inspection/history.
      - name: Upload RSpec status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rspec-status
          path: .rspec_status
          if-no-files-found: ignore
